<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e4e3de;--accent:#c4562b;--accent-ink:#fff;
  --chip:#efeee9;--chip-on:#1d1d1b;--chip-on-ink:#fff;--good:#2f7d4f;--new:#2b63c4;--code:#f1f0ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151514;--panel:#1e1e1c;--ink:#ecebe6;--muted:#9b9a94;--line:#2f2f2c;--accent:#e07a4f;--accent-ink:#151514;
  --chip:#2a2a27;--chip-on:#ecebe6;--chip-on-ink:#151514;--good:#5fbf86;--new:#6c9cf0;--code:#262624;}}
:root[data-theme="dark"]{
  --bg:#151514;--panel:#1e1e1c;--ink:#ecebe6;--muted:#9b9a94;--line:#2f2f2c;--accent:#e07a4f;--accent-ink:#151514;
  --chip:#2a2a27;--chip-on:#ecebe6;--chip-on-ink:#151514;--good:#5fbf86;--new:#6c9cf0;--code:#262624;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
header{padding:28px 24px 8px;max-width:1280px;margin:auto}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:4px;font-size:14px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted);align-items:center}
.stats b{color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
.controls{max-width:1280px;margin:auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
input[type=search],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1 1 240px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip{border:none;background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{opacity:.6;margin-left:3px}
main{max-width:1280px;margin:auto;padding:16px 24px 60px}
.count{color:var(--muted);font-size:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:16px;word-break:break-word}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.badge.off{border-color:var(--good);color:var(--good)}
.badge.new{border-color:var(--new);color:var(--new)}
.one{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.zh{font-size:14.5px;line-height:1.6}
.kinds{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.kinds button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;font-size:15px;color:var(--muted)}
.kinds button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.install{background:var(--code);border-radius:8px;padding:10px 12px;font-size:13px;overflow-wrap:anywhere}
.install code{font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px;background:var(--panel)}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink)}
.en{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reason{font-size:12px;color:var(--new)}
.cardfoot{display:flex;align-items:flex-end;gap:8px;margin-top:auto}
.cardfoot .tags{flex:1}
.fb{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 7px;font-size:13px;opacity:.55}
.fb:hover{opacity:1}.fb.on{opacity:1;border-color:var(--accent);background:var(--chip)}
.card.disliked{opacity:.45}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11px;background:var(--chip);border-radius:5px;padding:1px 6px;color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:var(--panel);z-index:11;transform:translateX(100%);transition:transform .2s;overflow:auto;border-left:1px solid var(--line)}
.open .scrim{display:block}.open .drawer{transform:none}
.dhead{position:sticky;top:0;background:var(--panel);padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dhead h2{margin:0;font-size:20px;flex:1;word-break:break-word}
.dbody{padding:16px 22px 40px}
.dbody h4{margin:22px 0 6px;font-size:14px;color:var(--accent)}
.dbody ul{margin:0;padding-left:20px}
.links a{color:var(--accent);margin-right:14px;font-size:13px}
.md{border-top:1px solid var(--line);margin-top:24px;padding-top:10px;font-size:14px;overflow-wrap:anywhere}
.md pre,.md code{background:var(--code);border-radius:6px;font-size:12.5px}
.md pre{padding:10px;overflow:auto}.md code{padding:1px 4px}
.md table{border-collapse:collapse;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line);padding:4px 8px}
pre.log{white-space:pre-wrap;font-size:12px;background:var(--code);padding:12px;border-radius:8px}
.note{font-size:12px;color:var(--muted)}
@media (max-width:600px){header,.controls,main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Skill Explorer</h1>
  <div class="kinds" id="kinds"><button data-k="skill" class="on">Agent Skills</button><button data-k="mcp">MCP Servers</button></div>
  <div class="sub">自動追蹤 Anthropic、OpenAI、Google、GitHub Copilot、Microsoft/Azure、AWS 等官方與社群高星的 Agent Skills</div>
  <div class="stats" id="stats"></div>
</header>
<div class="controls">
  <div class="seg" id="view"><button data-v="cur" class="on">精選</button><button data-v="all">全部</button></div>
  <input type="search" id="q" placeholder="搜尋名稱、描述、用途…">
  <select id="cat"><option value="">全部分類</option></select>
  <select id="sort">
    <option value="rec">為你推薦</option>
    <option value="stars">依星星數</option>
    <option value="new">最新發現</option>
    <option value="name">依名稱</option>
  </select>
  <label class="note"><input type="checkbox" id="official"> 只看官方</label>
  <div class="chips" id="vendors"></div>
</div>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="layer">
  <div class="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer"></aside>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = iso => iso ? new Date(iso).toLocaleString("zh-TW", {hour12:false}) : "—";
let ALL = [], VENDOR = "", VIEW = "cur", KIND = "skill", pollTimer = null, FIRST = 0;
// NEW = discovered in the last 7 days, but not part of the very first crawl
const isNew = s => { const t = new Date(s.first_seen); return Date.now() - t < 7*864e5 && t - FIRST > 864e5; };

async function load() {
  ALL = await (await fetch("/api/skills?kind=" + KIND)).json();
  FIRST = Math.min(...ALL.map(s => new Date(s.first_seen)));
  const cats = [...new Set(ALL.map(s => s.analysis?.category).filter(Boolean))].sort();
  $("#cat").innerHTML = '<option value="">全部分類</option>' + cats.map(c => `<option>${esc(c)}</option>`).join("");
  renderVendors(); render();
}

function renderVendors() {
  const counts = {};
  ALL.forEach(s => counts[s.vendor] = (counts[s.vendor] || 0) + 1);
  let vs = Object.keys(counts).sort((a,b) => (a==="Community")-(b==="Community") || counts[b]-counts[a]);
  if (KIND === "mcp") vs = vs.slice(0, 15);  // MCP has hundreds of publishers: show the biggest
  $("#vendors").innerHTML = [["", "全部", ALL.length], ...vs.map(v => [v, v, counts[v]])]
    .map(([v,l,n]) => `<button class="chip ${v===VENDOR?"on":""}" data-v="${esc(v)}">${esc(l)}<small>${n}</small></button>`).join("");
  $("#vendors").querySelectorAll(".chip").forEach(b => b.onclick = () => { VENDOR = b.dataset.v; renderVendors(); render(); });
}

function render() {
  const q = $("#q").value.trim().toLowerCase(), cat = $("#cat").value, off = $("#official").checked, sort = $("#sort").value;
  let list = ALL.filter(s => (VIEW === "all" || s.curated || q) && (!VENDOR || s.vendor === VENDOR) && (!off || s.official) && (!cat || s.analysis?.category === cat));
  if (q) list = list.filter(s => [s.name, s.description, s.repo, s.summary_zh, JSON.stringify(s.analysis || {})].join(" ").toLowerCase().includes(q));
  list.sort(sort === "name" ? (a,b) => a.name.localeCompare(b.name)
          : sort === "new" ? (a,b) => b.first_seen.localeCompare(a.first_seen) || b.stars - a.stars
          : sort === "stars" ? (a,b) => b.official - a.official || b.stars - a.stars
          : (a,b) => b.score - a.score);
  $("#count").textContent = VIEW === "cur" && !q
    ? `精選 ${list.length} 個（依推薦排序、${KIND === "mcp" ? "每個發布者最多 3 個" : "每個 repo 最多 12 個"}；切到「全部」看完整 ${ALL.length} 個，搜尋會找全部）`
    : `顯示 ${list.length} / ${ALL.length} 個 skill`;
  $("#grid").innerHTML = list.length ? list.map(card).join("") :
    `<div class="empty">${ALL.length ? "沒有符合條件的 skill" : "還沒有資料，按右上「立即更新」開始抓取"}</div>`;
  $("#grid").querySelectorAll(".card").forEach(el => el.onclick = () => openSkill(el.dataset.id));
  $("#grid").querySelectorAll(".fb").forEach(b => b.onclick = e => { e.stopPropagation(); vote(b.dataset.id, +b.dataset.v); });
}

function card(s) {
  const a = s.analysis || {};
  return `<div class="card ${s.feedback===-1?"disliked":""}" data-id="${esc(s.id)}">
    <h3>${esc(s.name)}</h3>
    <div class="meta">
      <span>${esc(s.vendor)}</span>
      ${s.official ? '<span class="badge off">官方</span>' : ""}
      ${isNew(s) ? '<span class="badge new">NEW</span>' : ""}
      <span>★ ${s.stars.toLocaleString()}</span>
      ${a.category ? `<span>· ${esc(a.category)}</span>` : ""}
    </div>
    <div class="zh">${esc(zhOf(s))}</div>
    ${s.reasons?.length ? `<div class="reason">${esc(s.reasons.join("；"))}</div>` : ""}
    <div class="cardfoot">
      <div class="tags">${(a.tags || []).slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${fbButtons(s)}
    </div>
  </div>`;
}
const zhOf = s => s.summary_zh || s.analysis?.one_liner || s.description;
const fbButtons = s => `<button class="fb ${s.feedback===1?"on":""}" data-id="${esc(s.id)}" data-v="${s.feedback===1?0:1}" title="喜歡：類似的會排更前面">👍</button>
  <button class="fb ${s.feedback===-1?"on":""}" data-id="${esc(s.id)}" data-v="${s.feedback===-1?0:-1}" title="沒興趣：排到最後">👎</button>`;
async function vote(id, v) {
  await fetch("/api/feedback", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, value:v})});
  const y = scrollY; await load(); scrollTo(0, y);
}

async function openSkill(id) {
  const s = await (await fetch("/api/skill?id=" + encodeURIComponent(id))).json();
  const a = s.analysis || {};
  const body = s.kind === "mcp" ? "" : s.content.replace(/^﻿?---[\s\S]*?\n---\s*\n?/, "");
  const md = window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(body)) : `<pre>${esc(body)}</pre>`;
  $("#drawer").innerHTML = `
    <div class="dhead"><h2>${esc(s.name)}</h2><button onclick="closeDrawer()">關閉</button></div>
    <div class="dbody">
      <div class="meta">
        <span>${esc(s.vendor)}</span>${s.official ? '<span class="badge off">官方</span>' : ""}
        <span>★ ${s.stars.toLocaleString()}</span><span>${esc(s.repo)}</span>
        ${s.kind === "mcp" ? `<span>MCP · ${esc(s.path)}</span>` : `<span>${s.n_files} 個檔案 · ${s.n_scripts} 腳本 · ${s.n_refs} 參考文件</span>`}
      </div>
      <p class="zh">${esc(zhOf(s))}</p>
      ${a.one_liner && a.one_liner !== s.summary_zh ? `<p>${esc(a.one_liner)}</p>` : ""}
      <div class="links"><a href="${esc(s.url)}" target="_blank" rel="noopener">${s.url.includes("github.com") ? "在 GitHub 查看 ↗" : "官方網站 ↗"}</a></div>
      <h4>厲害在哪</h4><ul>${(a.why_powerful || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <h4>可以應用在哪</h4><ul>${(a.use_cases || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <h4>原始描述</h4><p class="note">${esc(s.description)}</p>
      <p class="note">分析來源：${s.analysis_by === "rules" ? "內建規則（在 .env 設定 OPENAI_API_KEY 可改由模型深入分析）" : esc(s.analysis_by)} · 首次發現 ${fmtTime(s.first_seen)}</p>
      ${s.kind === "mcp" ? mcpInstall(s) : `<div class="md">${md}</div>`}
    </div>`;
  document.getElementById("layer").className = "open";
}
function mcpInstall(s) {
  let info = {}; try { info = JSON.parse(s.content); } catch (e) {}
  const rows = [];
  (info.remotes || []).forEach(r => rows.push(`<div>遠端連線（${esc(r.type)}）：<code>${esc(r.url)}</code></div>`));
  (info.packages || []).forEach(p => rows.push(`<div>套件（${esc(p.registryType)}）：<code>${esc(p.identifier)}${p.version ? "@" + esc(p.version) : ""}</code>${p.transport?.type ? "，" + esc(p.transport.type) : ""}</div>`));
  return `<h4>安裝 / 連線方式</h4><div class="install">${rows.join("") || "見官方說明"}</div>
    <p class="note">資料來源：官方 MCP Registry（registry.modelcontextprotocol.io）</p>`;
}
function closeDrawer(){ document.getElementById("layer").className = ""; }
document.addEventListener("keydown", e => e.key === "Escape" && closeDrawer());

async function showRuns() {
  const runs = await (await fetch("/api/runs?limit=5")).json();
  $("#drawer").innerHTML = `<div class="dhead"><h2>抓取紀錄</h2><button onclick="closeDrawer()">關閉</button></div>
    <div class="dbody">${runs.map(r => `<h4>#${r.id} · ${esc(r.status)} · ${fmtTime(r.started)}</h4>
      <div class="note">${esc(r.summary || "")}</div><pre class="log">${esc(r.log || "")}</pre>`).join("") || "尚無紀錄"}</div>`;
  document.getElementById("layer").className = "open";
}

async function refreshStatus() {
  const st = await (await fetch("/api/status")).json();
  const lr = st.last_run;
  $("#stats").innerHTML = `
    <span><b>${st.total}</b> skills${st.duplicates ? `（已去除 ${st.duplicates} 個重複）` : ""}</span>
    <span><b>${st.total_mcp}</b> MCP</span>
    <span><b>${st.sources.length}</b> 個來源</span>
    <span>中文摘要 <b>${st.summarized}</b>/${st.total + st.total_mcp}</span>
    <span>深入分析 <b>${st.llm_analyzed}</b></span>
    <span>上次更新：${lr ? fmtTime(lr.finished || lr.started) + " · " + esc(lr.summary || lr.status) : "—"}</span>
    <span>下次排程：${fmtTime(st.next_run)}</span>
    <button onclick="showRuns()">紀錄</button>
    <button onclick="sendDigest()" title="${st.email ? "立即寄出日報（含過去 24 小時新增）" : "尚未設定 SMTP，會產生日報但不寄信"}">${st.email ? "寄日報" : "產生日報"}</button>
    <button class="primary" id="refresh" ${st.running ? "disabled" : ""}>${st.running ? "抓取中…" : "立即更新"}</button>`;
  $("#refresh").onclick = async () => { await fetch("/api/refresh", {method:"POST"}); refreshStatus(); };
  clearTimeout(pollTimer);
  if (st.running) pollTimer = setTimeout(async () => { await refreshStatus(); }, 3000);
  if (refreshStatus.wasRunning && !st.running) load();
  refreshStatus.wasRunning = st.running;
}

async function sendDigest() {
  const r = await (await fetch("/api/digest/send", {method:"POST"})).json();
  if (r.detail) return alert(r.detail);
  if (!r.sent && !confirm("尚未設定 SMTP（.env 的 SMTP_HOST / MAIL_TO），日報已存檔。要開啟預覽嗎？")) return;
  if (r.sent) alert("日報已寄出"); else open("/api/digest/latest", "_blank");
}

$("#kinds").querySelectorAll("button").forEach(b => b.onclick = () => {
  KIND = b.dataset.k; VENDOR = ""; $("#cat").value = "";
  $("#kinds").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  $("#q").placeholder = KIND === "mcp" ? "搜尋 MCP server 名稱、用途…" : "搜尋名稱、描述、用途…";
  load();
});
$("#view").querySelectorAll("button").forEach(b => b.onclick = () => {
  VIEW = b.dataset.v; $("#view").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); render();
});
["#q","#cat","#sort","#official"].forEach(s => $(s).addEventListener("input", render));
load(); refreshStatus();
</script>
</body>
</html>
